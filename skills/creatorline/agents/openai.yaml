interface:
  display_name: "Creatorline"
  short_description: "Start here: make and post your content"
  default_prompt: "Use $creatorline to show me what I can make today with my brand and avatar."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: creatorline
      description: "Creatorline MCP server"
      transport: streamable_http
      url: https://api.creatorline.io/mcp
