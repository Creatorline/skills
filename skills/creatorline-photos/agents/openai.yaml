interface:
  display_name: "Photos and Carousels"
  short_description: "Avatar photoshoots and carousels"
  default_prompt: "Use $creatorline-photos to make a 6-photo carousel of my avatar with my product."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: creatorline
      description: "Creatorline MCP server"
      transport: streamable_http
      url: https://api.creatorline.io/mcp
